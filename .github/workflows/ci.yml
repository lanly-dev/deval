name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Type-check, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check extension and benchmarks
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Bundle the extension
        run: node esbuild.js

      # The reference suites use deterministic metrics only, so they need no
      # DEEPEVAL_API_KEY and behave the same here as they do locally.
      - name: Run DeepEval benchmarks
        run: npm run benchmark
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

  extension-host-tests:
    name: Extension host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile tests
        run: npm run compile-tests

      - name: Compile extension
        run: node esbuild.js

      # xvfb is required to launch VS Code, even for headless extension tests.
      - name: Run extension tests
        run: xvfb-run -a npm test
